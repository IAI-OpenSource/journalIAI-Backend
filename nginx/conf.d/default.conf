# Définition de la zone de cache (1 Go max, les clés stockées 60 min en RAM)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m inactive=24h max_size=1g;

# Configuration pour les WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    server_name api.iai-journal.test;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Headers indispensables pour les WebSockets FastAPI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers standards pour l'IP réelle et le protocole
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Augmenter les timeouts pour les connexions WS persistantes
        proxy_read_timeout 86400;

        # Pas de cache pour l'API
        proxy_cache off;
    }
}

# ─── API S3 MinIO ─────────────────────────────────────────────────────────────
# media.iai-journal.test:81 → minio:9000
server {
    listen 80;
    server_name media.iai-journal.test;

    # Autorise les fichiers jusqu'à 100 Mo pour les uploads multipart
    client_max_body_size 100M;

    # --- Requêtes dynamiques S3 : pas de cache ---
    # Listing objets, metadata, multipart, etc.
    location ~* ^/[^/]+/?$ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SUPPORT HLS & STREAMING ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # --- OPTIMISATION CACHE ---
        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_no_cache $http_range; # Désactive le cache pour les range requests (streaming)

        # Types de fichiers pour le HLS
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }
}

# ─── Console UI MinIO ─────────────────────────────────────────────────────────
# console.iai-journal.test:81 → minio:9001
server {
    listen 80;
    server_name console.iai-journal.test;

    # API REST de la Console (login, buckets, etc.)
    location /api/v1/ {
        proxy_pass http://minio:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # WebSocket temps réel de la Console
    location /ws {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # UI statique de la Console
    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

server {
    listen 80;
    server_name flower.iai-journal.test;

    location / {
        proxy_pass http://flower:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Pas de cache
        proxy_cache off;
    }
}


