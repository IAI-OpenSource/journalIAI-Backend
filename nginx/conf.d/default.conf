lua_package_path "/usr/local/openresty/lualib/?.lua;/etc/nginx/lua/?.lua;;";# Définition de la zone de cache (1 Go max, les clés stockées 60 min en RAM)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m inactive=24h max_size=1g;

init_by_lua_block {
    STREAM_JWT_SECRET  = os.getenv("STREAM_JWT_SECRET")
    MINIO_ROOT_USER   = os.getenv("MINIO_ROOT_USER")
    MINIO_ROOT_PASSWORD   = os.getenv("MINIO_ROOT_PASSWORD")
}

# Configuration pour les WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    server_name api.iai-journal.test;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Headers indispensables pour les WebSockets FastAPI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers standards pour l'IP réelle et le protocole
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Augmenter les timeouts pour les connexions WS persistantes
        proxy_read_timeout 86400;

        # Pas de cache pour l'API
        proxy_cache off;
    }
}

# ─── API S3 MinIO ─────────────────────────────────────────────────────────────
# media.iai-journal.test:81 → minio:9000
server {
    listen 80;
    server_name media.iai-journal.test;

    # Autorise les fichiers jusqu'à 100 Mo pour les uploads multipart
    client_max_body_size 100M;

    # --- Requêtes dynamiques S3 : pas de cache ---
    # Listing objets, metadata, multipart, etc.
    location ~* ^/[^/]+/?$ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SUPPORT HLS & STREAMING ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # --- OPTIMISATION CACHE ---
        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_no_cache $http_range; # Désactive le cache pour les range requests (streaming)
    }

    # ── Images privées ────────────────────────────────────────────────────────
    # URL publique : /images/{uuid}/{full|medium}.webp?token=...
    # URL MinIO    : /posts-permanent-content/processed-images/{uuid}/{variant}.webp
    #
    # $1 = uuid du média
    # $2 = variante (full ou medium)
    location ~* "^/posts-images/([a-f0-9-]{36})/(full|medium)\.webp$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-images";
        set $target_bucket      "posts-permanent-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/posts-permanent-content/processed-images/$1/$2.webp;

        proxy_set_header Host minio:9000;

        proxy_cache       STATIC_CACHE;
        proxy_cache_key   "img:$1:$2";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_http_version 1.1;
        types { image/webp webp; }
    }

     # ── HLS manifest ──────────────────────────────────────────────────────────
    # ── HLS manifest principal ────────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/master.m3u8?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/master.m3u8
    #
    # $1 = uuid
    location ~* "^/posts-hls/([a-f0-9-]{36})/master\.m3u8$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "posts-permanent-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/posts-permanent-content/processed-videos/$1/master.m3u8;
        proxy_set_header Host minio:9000;

        # Jamais caché — le manifest change à chaque transcodage
        proxy_no_cache    1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    # ── HLS playlist par qualité ──────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/{resolution}/index.m3u8?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/{resolution}/index.m3u8
    #
    # $1 = uuid
    # $2 = résolution (360p, 720p, 1080p)
    location ~* "^/posts-hls/([a-f0-9-]{36})/(360p|720p|1080p)/index\.m3u8$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "posts-permanent-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/posts-permanent-content/processed-videos/$1/$2/index.m3u8;
        proxy_set_header Host minio:9000;

        # Pas de cache non plus — lié au transcodage
        proxy_no_cache    1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    # ── HLS segments et init ──────────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/{resolution}/{fichier}?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/{resolution}/{fichier}
    #
    # Matche :
    #   /hls/{uuid}/720p/init.mp4
    #   /hls/{uuid}/1080p/seg_0.m4s
    #   /hls/{uuid}/1080p/seg_15.m4s
    #
    # $1 = uuid
    # $2 = résolution (360p, 720p, 1080p)
    # $3 = fichier (init.mp4 ou seg_N.m4s)
    location ~* "^/posts-hls/([a-f0-9-]{36})/(360p|720p|1080p)/(init\.mp4|seg_\d+\.m4s)$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "posts-permanent-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/posts-permanent-content/processed-videos/$1/$2/$3;
        proxy_set_header Host minio:9000;

        # Cache long — les segments sont immuables une fois générés
        proxy_cache       STATIC_CACHE;
        proxy_cache_key   "hls:$1:$2:$3";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Range requests pour le seeking
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4                     mp4 m4s;
        }
    }
    # ── Images privées ────────────────────────────────────────────────────────
    # URL publique : /images/{uuid}/{full|medium}.webp?token=...
    # URL MinIO    : /posts-permanent-content/processed-images/{uuid}/{variant}.webp
    #
    # $1 = uuid du média
    # $2 = variante (full ou medium)
    location ~* "^/stories-images/([a-f0-9-]{36})/(full|medium)\.webp$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-images";
        set $target_bucket      "stories-ephemeral-content";


        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/stories-ephemeral-content/processed-images/$1/$2.webp;

        proxy_set_header Host minio:9000;

        proxy_cache       STATIC_CACHE;
        proxy_cache_key   "img:$1:$2";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_http_version 1.1;
        types { image/webp webp; }
    }

     # ── HLS manifest ──────────────────────────────────────────────────────────
    # ── HLS manifest principal ────────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/master.m3u8?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/master.m3u8
    #
    # $1 = uuid
    location ~* "^/stories-hls/([a-f0-9-]{36})/master\.m3u8$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "stories-ephemeral-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/stories-ephemeral-content/processed-videos/$1/master.m3u8;
        proxy_set_header Host minio:9000;

        # Jamais caché — le manifest change à chaque transcodage
        proxy_no_cache    1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    # ── HLS playlist par qualité ──────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/{resolution}/index.m3u8?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/{resolution}/index.m3u8
    #
    # $1 = uuid
    # $2 = résolution (360p, 720p, 1080p)
    location ~* "^/stories-hls/([a-f0-9-]{36})/(360p|720p|1080p)/index\.m3u8$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "stories-ephemeral-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/stories-ephemeral-content/processed-videos/$1/$2/index.m3u8;
        proxy_set_header Host minio:9000;

        # Pas de cache non plus — lié au transcodage
        proxy_no_cache    1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    # ── HLS segments et init ──────────────────────────────────────────────────────
    # URL publique : /hls/{uuid}/{resolution}/{fichier}?token=...
    # MinIO        : /posts-permanent-content/processed-videos/{uuid}/{resolution}/{fichier}
    #
    # Matche :
    #   /hls/{uuid}/720p/init.mp4
    #   /hls/{uuid}/1080p/seg_0.m4s
    #   /hls/{uuid}/1080p/seg_15.m4s
    #
    # $1 = uuid
    # $2 = résolution (360p, 720p, 1080p)
    # $3 = fichier (init.mp4 ou seg_N.m4s)
    location ~* "^/stories-hls/([a-f0-9-]{36})/(360p|720p|1080p)/(init\.mp4|seg_\d+\.m4s)$" {
        set $upstream_media_id "";
        set $lua_prefix        "processed-videos";
        set $target_bucket      "stories-ephemeral-content";

        access_by_lua_file /etc/nginx/lua/validate_stream_token.lua;

        proxy_pass http://minio:9000/stories-ephemeral-content/processed-videos/$1/$2/$3;
        proxy_set_header Host minio:9000;

        # Cache long — les segments sont immuables une fois générés
        proxy_cache       STATIC_CACHE;
        proxy_cache_key   "hls:$1:$2:$3";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Range requests pour le seeking
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4                     mp4 m4s;
        }
    }
}
# ─── Console UI MinIO ─────────────────────────────────────────────────────────
# console.iai-journal.test:81 → minio:9001
server {
    listen 80;
    server_name console.iai-journal.test;

    # API REST de la Console (login, buckets, etc.)
    location /api/v1/ {
        proxy_pass http://minio:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # WebSocket temps réel de la Console
    location /ws {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # UI statique de la Console
    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
# On pourra ajouter d'autres locations pour d'autres services si besoin (ex: front, dashboard admin, etc.)
