# Définition de la zone de cache (1 Go max, les clés stockées 60 min en RAM)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m inactive=24h max_size=1g;

# Serveur Global (Redirection vers les bons serveurs selon les paths)
server {
    listen 80;
    server_name iai-jounal.dev;

    # Redirection vers le backend API pour les requêtes /api/ et vers MinIO pour les médias

    # Backend FastAPI pour les données dynamiques
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Pas de cache pour l'API (données dynamiques)
        proxy_cache off;
    }

    # Backend MinIO pour les médias (images, vidéos)
    location /media/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # --- OPTIMISATION CACHE ---
        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 24h; # Cache les images/vidéos réussies pendant 24h
        proxy_cache_valid 404 1m;      # Cache les erreurs 404 seulement 1 min
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status; # Pour vérifier si le cache fonctionne

        # --- SUPPORT HLS & STREAMING ---
        # Permet au navigateur de demander des morceaux de vidéo (Range Requests)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range; # Désactive le cache uniquement si la requête est spécifique (optionnel)

        # Types de fichiers pour le HLS
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # Monitoring Flower
    location /flower/ {
        proxy_pass http://flower:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Pas de cache pour le monitoring (données dynamiques)
        proxy_cache off;
    }

    # On pourra ajouter d'autres locations pour d'autres services si besoin (ex: front, dashboard admin, etc.)
}